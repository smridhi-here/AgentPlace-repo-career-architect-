services:
  postgres:
    image: postgres:16-alpine
    container_name: career-architect-db
    environment:
      POSTGRES_DB: career_architect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career-architect-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=career_architect
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: career-architect-ai-engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PYTHONPATH: /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080
        - NEXT_PUBLIC_AI_ENGINE_URL=http://localhost:8000 # <--- Changed 8001 to 8000
    container_name: career-architect-frontend
    ports:
      - "3000:3000"
    init: true
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_AI_ENGINE_URL=http://localhost:8000 # <--- Changed 8001 to 8000
    depends_on:
      backend:
        condition: service_started
      ai-engine:
        condition: service_started

volumes:
  postgres_data: